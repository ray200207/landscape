<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>情緒色彩地圖 · Urban Landscape Lab</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f13;
      height: 100vh;
      overflow: hidden;
      font-family: 'Noto Sans TC', 'Segoe UI', sans-serif;
      color: #d4d4e8;
    }

    #map {
      width: 100%;
      height: calc(100vh - 60px);
    }

    .leaflet-control-zoom a {
      background: #1a1a24 !important;
      border-color: #2e2e42 !important;
      color: #d4d4e8 !important;
      font-size: 16px !important;
    }
    .leaflet-control-zoom a:hover { background: #2e2e42 !important; }
    .leaflet-control-attribution {
      background: rgba(15, 15, 19, 0.82) !important;
      color: #4a4a6a !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a { color: #5c6a88 !important; }

    .emotion-popup .leaflet-popup-content-wrapper {
      background: #1a1a24;
      border: 1px solid #2e2e42;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
      color: #e0e0f0;
      padding: 0;
    }
    .emotion-popup .leaflet-popup-content   { margin: 14px 16px; }
    .emotion-popup .leaflet-popup-tip       { background: #1a1a24; box-shadow: none; }
    .emotion-popup .leaflet-popup-close-button {
      color: #8888aa !important;
      font-size: 18px !important;
      top: 8px !important; right: 10px !important;
    }
    .emotion-popup .leaflet-popup-close-button:hover { color: #d4d4e8 !important; }

    @keyframes spin    { to { transform: rotate(360deg) } }
    @keyframes fadeIn  { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes slideUp { from{opacity:0;transform:translateX(-50%) translateY(12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
</head>

<body>

  <!-- ══ 頁首 ═════════════════════════════════════════════════════════════════ -->
  <header style="position:sticky;top:0;z-index:1000;
                 background:rgba(15,15,19,0.92);backdrop-filter:blur(16px);
                 border-bottom:1px solid #2e2e42;height:60px;
                 display:flex;align-items:center;padding:0 24px;gap:12px">

    <a href="/"
       style="width:32px;height:32px;border-radius:8px;background:#1a1a24;
              border:1px solid #2e2e42;display:flex;align-items:center;
              justify-content:center;text-decoration:none;color:#d4d4e8;
              flex-shrink:0;transition:background .2s"
       title="返回首頁">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>

    <span style="font-family:'Cascadia Code','Courier New',monospace;font-weight:700;color:#fff">
      Urban<span style="color:#5c8aff">.</span>Lab
    </span>

    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#8888aa;margin-left:8px">
      <span style="width:8px;height:8px;border-radius:50%;background:#5c8aff;
                   display:inline-block;animation:pulse 2s ease infinite"></span>
      <span id="point-count" style="font-family:monospace">—</span>
      <span>個分析點位</span>
    </div>

    <!-- ── 清除點位按鈕 ──────────────────────────────────── -->
    <button id="clear-map-btn"
            style="margin-left:auto;display:flex;align-items:center;gap:5px;
                   padding:5px 12px;border-radius:8px;border:1px solid #2e2e42;
                   background:#1a1a24;color:#8888aa;font-size:11px;font-family:inherit;
                   cursor:pointer;transition:border-color .2s,color .2s;flex-shrink:0"
            title="清除所有地圖點位（同步移除資料庫記錄）"
            onmouseover="this.style.borderColor='#ef4444';this.style.color='#ef4444'"
            onmouseout="this.style.borderColor='#2e2e42';this.style.color='#8888aa'">
      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
      清除點位
    </button>

    <span style="font-family:monospace;font-size:12px;color:#8888aa;
                 background:#1a1a24;padding:4px 12px;border-radius:20px;border:1px solid #2e2e42">
      04 / 情緒色彩地圖
    </span>
  </header>

  <!-- ══ 地圖主體 ══════════════════════════════════════════════════════════════ -->
  <div id="map"></div>

  <!-- ══ Loading 遮罩 ══════════════════════════════════════════════════════════ -->
  <div id="map-loading"
       style="position:fixed;inset:60px 0 0 0;z-index:600;
              display:flex;flex-direction:column;align-items:center;justify-content:center;
              background:rgba(15,15,19,0.82);gap:14px;animation:fadeIn .3s ease both">
    <div style="width:44px;height:44px;border-radius:50%;
                border:2px solid rgba(92,138,255,0.2);
                border-top-color:#5c8aff;
                animation:spin 1s linear infinite"></div>
    <p style="font-size:14px;color:#8888aa">正在載入地圖點位…</p>
  </div>

  <!-- ══ 空狀態 ════════════════════════════════════════════════════════════════ -->
  <div id="map-empty"
       style="position:fixed;inset:60px 0 0 0;z-index:500;
              display:none;flex-direction:column;align-items:center;justify-content:center;
              pointer-events:none;gap:14px;animation:fadeIn .4s ease both">
    <div style="font-size:52px">🗺️</div>
    <p style="font-size:18px;color:#fff;font-weight:700">尚無地理情緒紀錄</p>
    <p style="font-size:13px;color:#8888aa;text-align:center;max-width:300px;line-height:1.7">
      上傳含有 GPS EXIF 資訊的街景照片並完成情緒分析，<br>
      點位便會自動標記於此地圖上
    </p>
    <a href="/"
       style="margin-top:8px;padding:10px 28px;border-radius:10px;
              background:#5c8aff;color:#fff;text-decoration:none;
              font-size:13px;font-weight:600;pointer-events:all;
              transition:background .2s"
       onmouseover="this.style.background='#3a6be8'"
       onmouseout="this.style.background='#5c8aff'">
      前往分析照片
    </a>
  </div>

  <!-- ══ 無 GPS 拖曳釘選橫幅 ════════════════════════════════════════════════ -->
  <div id="no-gps-banner"
       style="display:none;position:fixed;bottom:68px;left:50%;
              transform:translateX(-50%);z-index:700;
              background:rgba(26,26,36,0.96);border:1px solid #3a5aff55;
              border-radius:16px;padding:16px 20px;backdrop-filter:blur(14px);
              width:min(460px,calc(100vw - 32px));
              box-shadow:0 8px 36px rgba(0,0,0,.65);
              animation:slideUp .35s ease both">

    <!-- 說明列 -->
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:0">
      <span style="font-size:20px;flex-shrink:0;margin-top:1px">📍</span>
      <div>
        <p style="font-size:13px;color:#e0e0f0;font-weight:600;margin-bottom:3px">
          此照片未偵測到定位資訊
        </p>
        <p id="no-gps-msg" style="font-size:12px;color:#8888aa;line-height:1.6">
          請<strong style="color:#c0c0e0">直接在地圖上點擊</strong>以放置點位，
          或拖曳大頭針至正確位置，再點擊下方「確認釘選」
        </p>
      </div>
    </div>

    <!-- 確認列（拖曳後顯示） -->
    <div id="pin-confirm-area"
         style="display:none;margin-top:12px;padding-top:12px;
                border-top:1px solid #2e2e42;
                align-items:center;justify-content:space-between;gap:10px">
      <span id="pin-coords"
            style="font-family:monospace;font-size:11px;color:#8888aa">—</span>
      <button id="pin-confirm-btn"
              style="padding:7px 18px;border-radius:10px;background:#5c8aff;
                     border:none;color:#fff;font-size:12px;font-weight:600;
                     cursor:pointer;flex-shrink:0;transition:background .2s"
              onmouseover="this.style.background='#3a6be8'"
              onmouseout="this.style.background='#5c8aff'">
        確認釘選此位置
      </button>
    </div>

    <!-- 儲存中 -->
    <p id="pin-saving-msg"
       style="display:none;margin-top:10px;font-size:12px;
              color:#8888aa;text-align:center">
      正在儲存…
    </p>

    <!-- 成功 -->
    <p id="pin-success-msg"
       style="display:none;margin-top:10px;font-size:12px;
              color:#34d399;text-align:center;font-weight:600">
      ✓ 位置已儲存至地圖
    </p>
  </div>

  <!-- ══ 圖例（左下角）════════════════════════════════════════════════════════ -->
  <div style="position:fixed;bottom:52px;left:16px;z-index:500;
              background:rgba(26,26,36,0.92);border:1px solid #2e2e42;
              border-radius:12px;padding:12px 16px;
              backdrop-filter:blur(10px);min-width:190px">

    <p style="font-size:10px;font-family:monospace;color:#5c8aff;
              letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px">
      // 圖例說明
    </p>

    <div style="display:flex;flex-direction:column;gap:8px;font-size:11px;color:#8888aa">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:50%;flex-shrink:0;
                    background:radial-gradient(circle,rgba(92,138,255,0.88) 0%,rgba(92,138,255,0) 100%)">
        </div>
        <span>情緒色彩（100 公尺漸層圓）</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <div style="width:10px;height:10px;border-radius:50%;background:#5c8aff;
                      box-shadow:0 0 6px #5c8affaa"></div>
        </div>
        <span>點擊色塊查看詳情</span>
      </div>
    </div>
  </div>

  <!-- Leaflet JS（必須在 map.js 之前） -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- ⚠️  相對路徑，同時相容 FastAPI 伺服器與直接開檔 -->
  <script src="js/map.js"></script>
</body>
</html>
